name: pr-text-selftest

# Runs the pr-text tests, then this repository's own pull request through
# the reusable pr-text workflow with the pull request's copy of the script,
# so a change that breaks the org-wide check fails here first.

on:
  pull_request:
    paths:
      - .github/aurora/pr-text*.sh
      - .github/workflows/pr-text*.yml
  push:
    branches: [main]
    paths:
      - .github/aurora/pr-text*.sh
      - .github/workflows/pr-text*.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash .github/aurora/pr-text-test.sh

  this-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: tests
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-text.yml
    with:
      tool-ref: ${{ github.event.pull_request.head.sha }}
