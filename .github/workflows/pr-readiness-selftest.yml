name: pr-readiness-selftest

on:
  pull_request:
    paths:
      - .github/aurora/pr-readiness*.py
      - .github/workflows/pr-readiness*.yml
  push:
    branches: [main]
    paths:
      - .github/aurora/pr-readiness*.py
      - .github/workflows/pr-readiness*.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 .github/aurora/pr-readiness-test.py
