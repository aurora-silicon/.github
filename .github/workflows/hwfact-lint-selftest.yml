name: hwfact-lint-selftest

# Runs the hwfact-lint self-test, then this repository's own pull request
# through the reusable workflow with the pull request's copy of the script,
# so a change that breaks the org-wide check fails here first.

on:
  pull_request:
    paths:
      - .github/aurora/hwfact-lint.py
      - .github/workflows/hwfact-lint*.yml
  push:
    branches: [main]
    paths:
      - .github/aurora/hwfact-lint.py
      - .github/workflows/hwfact-lint*.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -I .github/aurora/hwfact-lint.py --self-test

  this-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: tests
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/hwfact-lint.yml
    with:
      tool-ref: ${{ github.event.pull_request.head.sha }}
