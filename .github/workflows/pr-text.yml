name: pr-text

# Reusable PR text check for every Aurora Silicon repository: the 'Tested:'
# and 'Risk:' lines of agent-guidelines policy/pr-structure.md, and no AI
# attribution in the title, body or the author's own commits.
# The logic is .github/aurora/pr-text.sh in this repository (one copy for
# the whole org, self-tested by pr-text-selftest.yml). If that script is
# missing or stops rejecting a bad body, the check fails; it never skips.
# Never runs PR code.
# Callers: copy workflow-templates/pr-text.yml into the repository.

on:
  workflow_call:
    inputs:
      since:
        description: PRs created before this time get warnings only
        type: string
        default: "2026-11-25T00:00:00Z"
      tool-ref:
        description: Ref of aurora-silicon/.github that holds pr-text.sh
        type: string
        default: main

permissions: {}

jobs:
  pr-text:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Canonical pr-text script
        uses: actions/checkout@v7
        with:
          repository: aurora-silicon/.github
          ref: ${{ inputs.tool-ref }}
          path: .canon-policy
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/aurora
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: The check can fail
        # A checker that passes everything looks the same as a clean PR.
        # Prove this copy still rejects an empty body before trusting it.
        env:
          TOOL_REF: ${{ inputs.tool-ref }}
        run: |
          script=.canon-policy/.github/aurora/pr-text.sh
          if [ ! -f "$script" ]; then
            echo "::error title=pr-text broken::$script is missing from aurora-silicon/.github@$TOOL_REF. Fix the canonical copy there; this check does not skip."
            exit 1
          fi
          if PR_TITLE=x PR_BODY='' PR_CREATED=2999-01-01T00:00:00Z PR_DRAFT=false bash "$script" >/dev/null 2>&1; then
            echo "::error title=pr-text broken::$script accepted an empty PR body. Fix the canonical copy in aurora-silicon/.github; this check does not skip."
            exit 1
          fi

      - name: Collect the author's commit messages
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Owner-reviewed lists contain only commits already published before
          # enforcement. Each list applies to one repository, PR and head.
          published=".canon-policy/.github/aurora/published-history/$GITHUB_REPOSITORY/$PR/$HEAD_SHA.txt"
          if [ ! -f "$published" ]; then
            published=/dev/null
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate |
            jq -rs --rawfile published "$published" '
              ($published | split("\n")) as $excluded |
              .[][] | select(.author.login == env.AUTHOR) |
              select(.sha as $sha | $excluded | index($sha) == null) |
              "commit \(.sha)\n\(.commit.message)"
            ' > "$RUNNER_TEMP/commits"

      - name: Check the pull request text
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED: ${{ github.event.pull_request.created_at }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          STRUCTURE_SINCE: ${{ inputs.since }}
          COMMITS_FILE: ${{ runner.temp }}/commits
        run: bash .canon-policy/.github/aurora/pr-text.sh
